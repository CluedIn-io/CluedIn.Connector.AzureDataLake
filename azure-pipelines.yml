name: $(Date:yyyyMMdd)$(Rev:.r)
parameters:
  - name: runIntegrationTests
    displayName: Run Integration Tests
    type: boolean
    default: true

  # Snowflake integration tests hit a shared, externally-billed Snowflake test account
  # (not something this pipeline provisions), so they're opt-in rather than running by
  # default alongside the rest of the integration suite. See SnowflakeTestCredentials.cs.
  - name: runSnowflakeTests
    displayName: Run Snowflake Integration Tests
    type: boolean
    default: false

  # Runs the stream cache write benchmark (build/benchmark.jobs.yml) instead of the build and test jobs. The nightly
  # benchmark schedule below does the same.
  - name: runBenchmark
    displayName: Run the cache write benchmark instead of the build
    type: boolean
    default: false

  # Runs the cleanup of what the integration tests leave behind (build/cleanup.jobs.yml) instead of the build and test jobs. The
  # nightly cleanup schedule below does the same. With cleanupDryRun it only lists what it would delete.
  - name: runCleanup
    displayName: Run the cleanup of the integration test resources instead of the build
    type: boolean
    default: false

  - name: cleanupDryRun
    displayName: Cleanup only lists what it would delete (when running the cleanup)
    type: boolean
    default: false

  - name: pipelineTemplateRef
    displayName: Pipeline Template Ref
    type: string
    default: refs/heads/feature/multi-version-packaging

  # Manual, one-off check that this repo still builds and tests cleanly against a CluedIn.Core
  # version outside multiVersionCluedInTargets below - leave blank for a normal run.
  - name: probeCluedInVersion
    displayName: Probe CluedIn Version (leave blank for a normal run)
    type: string
    default: ''

trigger:
  branches:
    include:
    - develop
    - master
    - release/*

# Two nightly schedules, that run different jobs (see the jobs below).
# - The cache write benchmark: 'always: false' runs it only when develop has changed since the last scheduled run that
#   succeeded, so a night without a change on develop costs nothing.
# - The cleanup of what the integration tests leave behind (the storage account, the OneLake lakehouse and the Open Mirroring
#   mirrored database): it runs every night. Its displayName has to be the
#   cleanupScheduleName that is passed to the jobs below, as that is how the jobs tell the two schedules apart.
schedules:
  - cron: '0 1 * * *'
    displayName: Nightly cache write benchmark
    branches:
      include:
        - develop
    always: false
  - cron: '0 4 * * *'
    displayName: Nightly cleanup
    branches:
      include:
        - develop
    always: true

# Perform build for a PR to any branch, as if you run PR, you most likely want CI checks.
pr: ['*']

resources:
  repositories:
    - repository: templates
      type: github
      name: CluedIn-io/AzurePipelines.Templates
      endpoint: 'CluedIn-io'
      ref: ${{ parameters.pipelineTemplateRef }}

variables:
  - name: testFolderPath
    value: '$(Build.SourcesDirectory)/test'
  - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
    value: true
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: true
  - name: buildConfiguration
    value: Release
  - name: RUN_SNOWFLAKE_TESTS
    value: ${{ parameters.runSnowflakeTests }}
  - group: AzureDataLakeConnector_BuildLock
    # Requires variable group 'AzureDataLakeConnector_BuildLock' to exist and be authorized for this pipeline.
    # Configure an 'Exclusive lock' check on this variable group in Azure DevOps; the lockBehavior below relies on it for serialization.

# Serialize all runs for this pipeline; change to 'runLatest' if only the latest queued run should proceed.
lockBehavior: sequential

# jobs:, not pool:/steps: - crawler.build.jobs.yml is a jobs template, the only one with
# multi-version support (crawler.build.yml has none).
jobs:
  # A scheduled run (and a run that asks for the benchmark or the cleanup) does not build or test. Each of its jobs checks which
  # schedule started the run: the benchmark runs for every run but the one of the cleanup schedule, which only cleans up.
  # Every other run builds and tests.
  - ${{ if or(eq(variables['Build.Reason'], 'Schedule'), eq(parameters.runBenchmark, true), eq(parameters.runCleanup, true)) }}:
    - ${{ if or(eq(variables['Build.Reason'], 'Schedule'), eq(parameters.runBenchmark, true)) }}:
      - template: build/benchmark.jobs.yml
        parameters:
          cleanupScheduleName: 'Nightly cleanup'
    - ${{ if or(eq(variables['Build.Reason'], 'Schedule'), eq(parameters.runCleanup, true)) }}:
      - template: build/cleanup.jobs.yml
        parameters:
          cleanupScheduleName: 'Nightly cleanup'
          dryRun: ${{ parameters.cleanupDryRun }}
  - ${{ else }}:
    - template: crawler.build.jobs.yml@templates
      parameters:
        pool:
          vmImage: 'ubuntu-22.04'
        githubReleaseInMaster: true
        publicReleaseForMaster: true
        publishCodeCoverage: true
        useGitVersionDotNetTool: true
        publishToDevFeed: true
        probeCluedInVersion: ${{ parameters.probeCluedInVersion }}
        executeIntegrationTests: ${{ parameters.runIntegrationTests }}
        createIntegrationEnvironmentScriptFilePath: './build/integration-test.ps1'
        createIntegrationEnvironmentScriptArguments: '-Action SetUp'
        deleteIntegrationEnvironmentScriptFilePath: './build/integration-test.ps1'
        deleteIntegrationEnvironmentScriptArguments: '-Action TearDown'
        # Matches this repo's own CLUEDIN_V46_OR_GREATER/V47_OR_GREATER/V48_OR_GREATER/V50_OR_GREATER
        # DefineConstants gates in Directory.Build.props. release/4.6.7, release/4.7.4 and
        # release/4.8.1(/.2) are all still actively released lines (tags as recent as 2026-08-11) -
        # 4.6.0 is included unlike most other repos' multi-version migrations. 5.0.0-beta.* floats to
        # whatever prerelease is newest in the develop feed.
        multiVersionCluedInTargets:
          - cluedInVersion: '4.6.0'
          - cluedInVersion: '4.7.0'
          - cluedInVersion: '4.8.0'
          - cluedInVersion: '5.0.0'
