name: $(Date:yyyyMMdd)$(Rev:.r)
parameters:
  - name: runIntegrationTests
    displayName: Run Integration Tests
    type: boolean
    default: true
    
  - name: pipelineTemplateRef
    displayName: Pipeline Template Ref
    type: string
    default: refs/heads/refactor

trigger:
  branches:
    include:
    - develop
    - master
    - release/*

# Perform build for a PR to any branch, as if you run PR, you most likely want CI checks.
pr: ['*']

resources:
  repositories:
    - repository: templates
      type: github
      name: CluedIn-io/AzurePipelines.Templates
      endpoint: 'CluedIn-io'
      ref: ${{ parameters.pipelineTemplateRef }}

pool:
  vmImage: 'ubuntu-22.04'

variables:
  - name: testFolderPath
    value: '$(Build.SourcesDirectory)/test'
  - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
    value: true
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: true
  - name: buildConfiguration
    value: Release
  - group: AzureDataLakeConnector_BuildLock
    # Requires variable group 'AzureDataLakeConnector_BuildLock' to exist and be authorized for this pipeline.
    # Configure an 'Exclusive lock' check on this variable group in Azure DevOps; the lockBehavior below relies on it for serialization.

# Serialize all runs for this pipeline; change to 'runLatest' if only the latest queued run should proceed.
lockBehavior: sequential

steps:
  - task: UseDotNet@2
    displayName: Install .NET SDK 6.0
    inputs:
      version: 6.0.x

  - task: NuGetAuthenticate@0
    displayName: 'Authenticate with nuget'

  - template: crawler.build.yml@templates
    parameters:
      githubReleaseInMaster: true
      publicReleaseForMaster: true
      executeIntegrationTests: ${{ parameters.runIntegrationTests }}
      createIntegrationEnvironmentScriptFilePath: './build/integration-test.ps1'
      createIntegrationEnvironmentScriptArguments: '-Action SetUp'
      deleteIntegrationEnvironmentScriptFilePath: './build/integration-test.ps1'
      deleteIntegrationEnvironmentScriptArguments: '-Action TearDown'
      publishCodeCoverage: true
      useGitVersionDotNetTool: true
      publishToDevFeed: true
   # Integration Test
  - task: PowerShell@2
    displayName: 'Setup Integration Test Environment'
    inputs:
      filePath: './build/integration-test.ps1'
      arguments: '-Action SetUp'
    condition: and ( succeeded(), ${{ parameters.runIntegrationTests }})
  
  - task: DotNetCoreCLI@2
    displayName: 'Run Integration tests 2 '
    condition: and ( succeeded(), ${{ parameters.runIntegrationTests }})
    inputs:
      command: 'test'
      testRunTitle: 'Integration Tests'
      nobuild: true
      projects: 'test/integration/**/*.csproj'
      arguments: '--configuration $(buildConfiguration) --settings ./test/test.runsettings --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura'
  
  - task: DotNetCoreCLI@2
    displayName: 'Run Integration tests 3'
    condition: and ( succeeded(), ${{ parameters.runIntegrationTests }})
    inputs:
      command: 'test'
      testRunTitle: 'Integration Tests'
      nobuild: true
      projects: 'test/integration/**/*.csproj'
      arguments: '--configuration $(buildConfiguration) --settings --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura'
  
  - task: DotNetCoreCLI@2
    displayName: 'Run Integration tests 4'
    condition: and ( succeeded(), ${{ parameters.runIntegrationTests }})
    inputs:
      command: 'test'
      testRunTitle: 'Integration Tests'
      nobuild: true
      projects: 'test/integration/**/*.csproj'
      arguments: '--configuration $(buildConfiguration) --settings  ./test/test.runsettings --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura'
  
  - task: PowerShell@2
    displayName: 'Tear Down Integration Test Environment'
    inputs:
      filePath: './build/integration-test.ps1'
      arguments: '-Action TearDown'
    condition: and ( always(), ${{ parameters.runIntegrationTests }})