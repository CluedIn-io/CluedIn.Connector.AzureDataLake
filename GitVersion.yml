mode: ContinuousDeployment
# The CluedIn version is now encoded in the published package suffix (e.g. .460/.470/.480/.500 -
# see crawler.build.jobs.yml), so this repo's own version no longer needs to track CluedIn. Reset
# to 1.0. next-version alone isn't enough - GitVersion still sees the old tags in history and
# treats them as dominant - so commits-before skips everything up to and including the highest
# pre-existing tag (5.0.0-alpha.200, 2026-09-02T07:09:30+08:00).
next-version: 1.0
ignore:
  commits-before: 2026-09-10T00:00:00
branches:
  main:
    mode: ContinuousDelivery
  develop:
    tag: alpha
    increment: Patch
    # Do not track release branches, but rather look at the last merge commit
    # when we got release branch merged into our branch and use it as a base
    tracks-release-branches: false

  release:
    regex: ^releases?[\/-].*$
    source-branches:
      - main
  support:
    tag: update
    increment: None
    source-branches:
      - main
  hotfix:
    tag: useBranchName
  pull-request:
    tag: alpha.0.pr
    increment: Patch
  feature:
    tag: alpha.0.{BranchName}
  unknown:
    regex: ^(?!master$|main$|develop$|releases?[\/-]|support[\/-]|hotfix(es)?[\/-]|features?[\/-]|(pull|pull\-requests|pr)[\/-]).*$
    tag: alpha.0.{BranchName}
    source-branches:
    - develop
    - main
    - release
    - support
    - hotfix
